services:
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env.local
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASS=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - API_BACKEND_HOST=0.0.0.0
      - API_BACKEND_PORT=5000
      - PROXY_HEADER=${PROXY_HEADER}
      - APP_BASIC_AUTH_USER=${APP_BASIC_AUTH_USER}
      - APP_BASIC_AUTH_PASS=${APP_BASIC_AUTH_PASS}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/service-account.json
    volumes:
      - ./backend/credentials:/app/credentials:ro
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://backend:5000
      - VITE_BACKEND_WS_URL=ws://backend:5000
      - VITE_PROXY_HEADER=${PROXY_HEADER}
    depends_on:
      - backend

volumes:
  pgdata:
